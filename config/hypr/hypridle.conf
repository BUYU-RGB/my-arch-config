general {
    lock_cmd = my-lock
    before_sleep_cmd = my-lock
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# Lock after 5 minutes.
listener {
    timeout = 300
    on-timeout = my-lock
    on-resume = hyprctl dispatch dpms on
}

# Turn displays off after 10 minutes.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
