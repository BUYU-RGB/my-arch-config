# Application bindings.

bindd = SUPER, RETURN, Terminal, exec, alacritty
bindd = SUPER ALT, RETURN, Tmux, exec, alacritty -e bash -lc "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, my-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (home), exec, uwsm-app -- nautilus --new-window "$HOME"
bindd = SUPER SHIFT, B, Browser, exec, my-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, my-browser --private
bindd = SUPER SHIFT, M, Music, exec, my-run-or-focus spotify spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, alacritty -e cliamp
bindd = SUPER SHIFT, N, Editor, exec, alacritty -e "${EDITOR:-nvim}"
bindd = SUPER SHIFT, D, Docker, exec, alacritty -e lazydocker
bindd = SUPER SHIFT, G, Signal, exec, my-run-or-focus ^signal$ signal-desktop
bindd = SUPER SHIFT, O, Obsidian, exec, my-run-or-focus ^obsidian$ obsidian
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent Hyprland treating it as a comment.
bindd = SUPER SHIFT, A, ChatGPT, exec, my-webapp ChatGPT "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, my-webapp Grok "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, my-webapp Calendar "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, my-webapp HEY "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, my-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, my-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, my-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, my-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, my-webapp X "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, my-webapp "X Post" "https://x.com/compose/post"

# Add extra bindings.
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Core interaction model.
unbind = SUPER, SPACE
unbind = SUPER ALT, SPACE
bindd = SUPER, SPACE, Launch apps, exec, my-launcher
bindd = SUPER ALT, SPACE, System menu, exec, my-menu

