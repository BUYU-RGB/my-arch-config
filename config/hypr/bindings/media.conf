# Laptop multimedia keys for volume, brightness, and media playback.
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, pamixer -i 5 && my-osd volume
bindeld = ,XF86AudioLowerVolume, Volume down, exec, pamixer -d 5 && my-osd volume
bindeld = ,XF86AudioMute, Mute, exec, pamixer -t && my-osd volume
bindeld = ,XF86AudioMicMute, Mute microphone, exec, pamixer --default-source -t && my-osd mic
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, brightnessctl set +5% && my-osd brightness
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%- && my-osd brightness
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, brightnessctl set 100% && my-osd brightness
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, brightnessctl set 1% && my-osd brightness
bindld = ,XF86TouchpadToggle, Toggle touchpad, exec, hyprctl keyword 'device[elan-touchpad]:enabled' 'toggle'

# Precise 1% multimedia adjustments with Alt modifier.
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, pamixer -i 1 && my-osd volume
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, pamixer -d 1 && my-osd volume
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, brightnessctl set +1% && my-osd brightness
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, brightnessctl set 1%- && my-osd brightness

bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
