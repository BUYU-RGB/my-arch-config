# Menus
bindd = SUPER, SPACE, Launch apps, exec, my-launcher
bindd = SUPER CTRL, E, Emoji picker, exec, my-launcher -m symbols
bindd = SUPER CTRL, C, Capture menu, exec, my-menu capture
bindd = SUPER CTRL, O, Toggle menu, exec, my-menu toggle
bindd = SUPER CTRL, H, Setup menu, exec, my-menu setup
bindd = SUPER ALT, SPACE, System menu, exec, my-menu
bindd = SUPER SHIFT, code:201, System menu, exec, my-menu
bindd = SUPER, ESCAPE, Power menu, exec, my-menu system
bindld = , XF86PowerOff, Power menu, exec, my-menu system
bindd = SUPER, K, Show key bindings, exec, my-keybindings
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, pkill -SIGUSR1 waybar
bindd = SUPER CTRL, SPACE, Style menu, exec, my-menu style
bindd = SUPER SHIFT CTRL, SPACE, Style menu, exec, my-menu style
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, my-toggle-opacity
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, my-toggle-gaps

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, my-toggle-service hypridle
bindd = SUPER CTRL, N, Toggle night light, exec, my-toggle-service hyprsunset

# Captures
bindd = , PRINT, Screenshot, exec, my-screenshot area
bindd = ALT, PRINT, Screen recording, exec, my-screenrecord
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "Time" "$(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send -u low "$(my-battery-status)"
bindd = SUPER CTRL ALT, W, Show weather, exec, notify-send -u low "$(my-weather-status)"

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, my-menu audio
bindd = SUPER CTRL, B, Bluetooth controls, exec, my-menu bluetooth
bindd = SUPER CTRL, W, Wifi controls, exec, my-menu wifi
bindd = SUPER CTRL, T, Activity, exec, alacritty -e btop

# Dictation, when voxtype is installed
bindd = SUPER CTRL, X, Toggle dictation, exec, voxtype record toggle
bindd  = , F9, Start dictation (push-to-talk), exec, voxtype record start
binddr = , F9, Stop dictation (push-to-talk),  exec, voxtype record stop

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bindd = SUPER CTRL, L, Lock system, exec, my-lock
